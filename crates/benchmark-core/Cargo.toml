[package]
name = "benchmark-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# `staticlib` is what we'll link into the watchOS / iOS / macOS app.
# `rlib` is needed so the local CLI binary can use the lib.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Path-dep into the patched wasmtime checkout. We benchmark the full
# parse+lower+interpret pipeline on-device, so cranelift is enabled
# *as a compiler* but configured (via `Config::target("pulley{32,64}")`)
# to emit Pulley bytecode rather than native machine code. The output is
# DATA, not executable pages — no MAP_JIT, App Store-safe. `gc-drc` is
# wasmtime's production collector (deferred reference counting, selected
# explicitly in `run_workload_iters`); with only `gc-null` the GC heap is
# bump-allocated and never reclaimed.
wasmtime = { path = "../../wasmtime/crates/wasmtime", default-features = false, features = ["pulley", "runtime", "std", "cranelift", "anyhow", "gc", "gc-drc", "gc-null"] }
anyhow = "1"
# tinywasm: pure-Rust interpreter (no JIT/AOT tier exists; `archive` —
# tinywasm's own bytecode serializer — stays off). `nightly-tail-calls`
# comes in through this crate's `nightly-dispatch` feature below.
# explodingcamera/tinywasm `next`, its default branch: the 0.11.0 release on
# crates.io predates the dispatch and operand-stack work merged there since.
tinywasm = { git = "https://github.com/explodingcamera/tinywasm", rev = "2e469af5a15e70cecfefa69ca0fa6c04bdb774c9", default-features = false, features = ["std", "parser", "validate"] }
# femtovg E2E host (feature `femtovg-e2e`): femtovg's wgpu renderer behind
# its wire replayer, on a headless Metal device.
femtovg = { path = "../../femtovg", default-features = false, features = ["wgpu", "wire"], optional = true }
wgpu = { version = "30", optional = true }
pollster = { version = "0.4", optional = true }

# No build-deps — workloads are pre-compiled into checked-in `.wasm` files
# (see scripts/build-workloads.sh and workloads-rs/*.rs); build.rs handles
# both the workload `cargo:rerun-if-changed` and the WAMR static-lib link.

[features]
# Guaranteed-tail-call interpreter dispatch for the runtimes that offer it
# as a cargo feature (tinywasm's `become`-based loop). Needs nightly, like
# Pulley's `--cfg=pulley_tail_calls`; scripts/build-lib.sh and
# scripts/build-host-cli.sh enable both together.
nightly-dispatch = ["tinywasm/nightly-tail-calls"]
# The femtovg-to-wasm E2E (docs/femtovg-e2e-abi.md): run_femtovg_e2e CLI and
# the bench_femtovg_e2e FFI. Needs Metal (macOS / iOS).
femtovg-e2e = ["dep:femtovg", "dep:wgpu", "dep:pollster"]

[[bin]]
name = "run_femtovg_e2e"
path = "src/bin/run_femtovg_e2e.rs"
required-features = ["femtovg-e2e"]

[[bin]]
name = "runwasm"
path = "src/bin/runwasm.rs"

[[bin]]
name = "profile-audio"
path = "src/bin/profile-audio.rs"

[[bin]]
name = "runwasm-compare"
path = "src/bin/runwasm-compare.rs"

[dev-dependencies]
# In-process wat → wasm compilation for the EH correctness integration
# tests in `tests/eh_correctness.rs`. Pulled only for `cargo test`; not
# linked into the staticlib that ships on-device.
wat = "1"
# JSON parsing for the relaxed-SIMD spec-testsuite runner
# (`tests/relaxed_simd_spec_testsuite.rs`). wast2json converts each
# .wast to JSON; we parse it here to drive WAMR through the
# canonical assertions, honouring `(either ...)` membership.
serde_json = "1"
