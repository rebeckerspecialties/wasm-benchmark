# xcodegen project definition for the wasm-benchmark Apple apps.
#
# Generated project goes to apps/WasmBenchmark.xcodeproj.  Regenerate with:
#   (cd apps && xcodegen generate)
#
# App Store layout: the iOS / iPadOS, tvOS and visionOS apps share the
# bundle ID com.rebeckerspecialties.wasmbench, so they are one App Store
# record with universal purchase, and the watchOS app ships inside the iOS
# app as its companion (<iOS bundle ID>.watchkitapp), installable on its own
# (WKRunsIndependentlyOfCompanionApp). The macOS app is the local M4 dev
# host.
#
# Each app links the benchmark-core static library that
# scripts/build-lib.sh writes to target/<rust triple>/release/, picked per
# SDK and architecture below.

name: WasmBenchmark
options:
  bundleIdPrefix: com.rebeckerspecialties
  createIntermediateGroups: true

settings:
  base:
    # Swift 6 language mode — strict concurrency, Sendable enforcement,
    # actor-isolation checks become hard errors. Helps catch data races
    # and pointer-ownership bugs at compile time instead of runtime.
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    LLVM_LTO: YES
    OTHER_LDFLAGS: "$(inherited) -lbenchmark_core -lc++"
    HEADER_SEARCH_PATHS: $(SRCROOT)/../crates/benchmark-core/include
    # The Rust simulator libraries are arm64 only.
    EXCLUDED_ARCHS: x86_64
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Hardcoded so device/sim builds work out of the box. Override at the
    # CLI for a different team: `xcodebuild ... DEVELOPMENT_TEAM=XXXXXXXXXX`.
    DEVELOPMENT_TEAM: 4GWK4YU2PW
    CODE_SIGN_STYLE: Automatic
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      ONLY_ACTIVE_ARCH: YES
    # Release builds every architecture of the destination: the watch app
    # needs both arm64_32 (Series 6-8, SE) and arm64 (Series 9 and later),
    # which App Store Connect requires since April 2026.
    Release:
      ONLY_ACTIVE_ARCH: NO

targets:
  # --------------------------------------------------------------
  # iOS / iPadOS app, iOS 17+. Runs on A12 and later only
  # (UIRequiredDeviceCapabilities), matching the libraries' -mcpu.
  # --------------------------------------------------------------
  WasmBenchmarkIOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WasmBenchmarkIOS
      - path: Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      # The watch app, embedded as the iOS app's companion.
      - target: WasmBenchmarkWatch
      # femtovg E2E: the Rust library's wgpu Metal backend (watchOS has no
      # Metal, so the watch library is built without the E2E).
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rebeckerspecialties.wasmbench
        INFOPLIST_FILE: WasmBenchmarkIOS/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        # Vision Pro gets the native visionOS app below.
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        SWIFT_OBJC_BRIDGING_HEADER: WasmBenchmarkIOS/BridgingHeader.h
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*][arch=arm64]":
          - $(SRCROOT)/../target/aarch64-apple-ios-sim/release
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*][arch=arm64]":
          - $(SRCROOT)/../target/aarch64-apple-ios/release

  # --------------------------------------------------------------
  # watchOS app, watchOS 11+: Series 6 and later, SE (2nd gen), Ultra.
  # Device builds carry arm64_32 and arm64 slices.
  # --------------------------------------------------------------
  WasmBenchmarkWatch:
    type: application
    platform: watchOS
    deploymentTarget: "11.0"
    sources:
      - path: WasmBenchmarkWatch
      - path: Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rebeckerspecialties.wasmbench.watchkitapp
        INFOPLIST_FILE: WasmBenchmarkWatch/Info.plist
        TARGETED_DEVICE_FAMILY: "4"
        # Archived inside the iOS app, not on its own.
        SKIP_INSTALL: YES
        SWIFT_OBJC_BRIDGING_HEADER: WasmBenchmarkWatch/BridgingHeader.h
        "LIBRARY_SEARCH_PATHS[sdk=watchsimulator*][arch=arm64]":
          - $(SRCROOT)/../target/aarch64-apple-watchos-sim/release
        "LIBRARY_SEARCH_PATHS[sdk=watchos*][arch=arm64_32]":
          - $(SRCROOT)/../target/arm64_32-apple-watchos/release
        "LIBRARY_SEARCH_PATHS[sdk=watchos*][arch=arm64]":
          - $(SRCROOT)/../target/aarch64-apple-watchos/release

  # --------------------------------------------------------------
  # tvOS app, tvOS 18+: every Apple TV from the Apple TV HD (A8) up, so
  # the tvOS libraries are built for the A8's ARMv8.0 baseline.
  # --------------------------------------------------------------
  WasmBenchmarkTV:
    type: application
    platform: tvOS
    deploymentTarget: "18.0"
    sources:
      - path: WasmBenchmarkTV
      - path: Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rebeckerspecialties.wasmbench
        INFOPLIST_FILE: WasmBenchmarkTV/Info.plist
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: App Icon & Top Shelf Image
        SWIFT_OBJC_BRIDGING_HEADER: WasmBenchmarkTV/BridgingHeader.h
        "LIBRARY_SEARCH_PATHS[sdk=appletvsimulator*][arch=arm64]":
          - $(SRCROOT)/../target/aarch64-apple-tvos-sim/release
        "LIBRARY_SEARCH_PATHS[sdk=appletvos*][arch=arm64]":
          - $(SRCROOT)/../target/aarch64-apple-tvos/release

  # --------------------------------------------------------------
  # visionOS app, visionOS 26+.
  # --------------------------------------------------------------
  WasmBenchmarkVision:
    type: application
    platform: visionOS
    deploymentTarget: "26.0"
    sources:
      - path: WasmBenchmarkVision
      - path: Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rebeckerspecialties.wasmbench
        INFOPLIST_FILE: WasmBenchmarkVision/Info.plist
        TARGETED_DEVICE_FAMILY: "7"
        SWIFT_OBJC_BRIDGING_HEADER: WasmBenchmarkVision/BridgingHeader.h
        "LIBRARY_SEARCH_PATHS[sdk=xrsimulator*][arch=arm64]":
          - $(SRCROOT)/../target/aarch64-apple-visionos-sim/release
        "LIBRARY_SEARCH_PATHS[sdk=xros*][arch=arm64]":
          - $(SRCROOT)/../target/aarch64-apple-visionos/release

  # --------------------------------------------------------------
  # macOS app — local M4 dev host, macOS 26+.
  # --------------------------------------------------------------
  WasmBenchmarkMac:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - path: WasmBenchmarkMac
      - path: Shared
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      # femtovg E2E: the Rust library's wgpu Metal backend.
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rebeckerspecialties.wasmbench.mac
        INFOPLIST_FILE: WasmBenchmarkMac/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: WasmBenchmarkMac/BridgingHeader.h
        LIBRARY_SEARCH_PATHS:
          - $(SRCROOT)/../target/release
